<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Editar perfil - QuestionPlace</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>

    <body class="bg-light">
        <nav class="navbar navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="/me">QuestionPlace</a>

                <button id="logoutButton" class="btn btn-light btn-sm">
                    Sair
                </button>
            </div>
        </nav>

        <main class="container py-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <img
                            id="profileImage"
                            src="https://placehold.co/96x96?text=?"
                            alt="Foto de perfil"
                            class="rounded-circle border"
                            style="width: 96px; height: 96px; object-fit: cover"
                        />

                        <div>
                            <h1 class="h4 mb-1">Editar perfil</h1>
                            <p class="text-muted mb-0">
                                Atualize suas informações e foto de perfil.
                            </p>
                        </div>
                    </div>

                    <form id="profileForm">
                        <div class="mb-3">
                            <label for="fullName" class="form-label">
                                Nome completo
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="fullName"
                                maxlength="255"
                                required
                            />
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Username
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                maxlength="50"
                                required
                            />
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                maxlength="255"
                                required
                            />
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">
                                Descrição
                            </label>
                            <textarea
                                class="form-control"
                                id="description"
                                rows="4"
                                placeholder="Fale um pouco sobre você"
                            ></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="profilePicture" class="form-label">
                                Nova foto de perfil
                            </label>
                            <input
                                type="file"
                                class="form-control"
                                id="profilePicture"
                                accept="image/jpeg,image/png,image/webp"
                            />
                            <div class="form-text">
                                Formatos aceitos: JPG, PNG e WEBP.
                            </div>
                        </div>

                        <p id="message" class="mb-3" role="status"></p>

                        <div class="d-flex gap-2">
                            <button
                                id="saveButton"
                                class="btn btn-primary"
                                type="submit"
                            >
                                Salvar alterações
                            </button>
                            <a href="/me" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <script>
            const token = localStorage.getItem("access_token");
            const form = document.getElementById("profileForm");
            const message = document.getElementById("message");
            const saveButton = document.getElementById("saveButton");

            if (!token) {
                window.location.href = "/";
            }

            function handleUnauthorized(response) {
                if (response.status !== 401) {
                    return false;
                }

                localStorage.removeItem("access_token");
                window.location.href = "/";
                return true;
            }

            async function loadUser() {
                const response = await fetch("/users/me", {
                    headers: {
                        Authorization: `Bearer ${token}`,
                    },
                });

                if (handleUnauthorized(response)) {
                    return;
                }

                if (!response.ok) {
                    message.textContent = "Erro ao carregar o perfil.";
                    message.className = "mb-3 text-danger";
                    return;
                }

                const user = await response.json();

                document.getElementById("fullName").value = user.full_name;
                document.getElementById("username").value = user.username;
                document.getElementById("email").value = user.email;
                document.getElementById("description").value =
                    user.description || "";

                if (user.profile_picture_url) {
                    document.getElementById("profileImage").src =
                        user.profile_picture_url;
                }
            }

            async function updateInformation() {
                const payload = {
                    full_name: document.getElementById("fullName").value.trim(),
                    username: document.getElementById("username").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    description:
                        document.getElementById("description").value.trim() ||
                        null,
                };

                const response = await fetch("/users/me", {
                    method: "PATCH",
                    headers: {
                        Authorization: `Bearer ${token}`,
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(payload),
                });

                if (handleUnauthorized(response)) {
                    throw new Error("unauthorized");
                }

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Erro ao atualizar perfil");
                }
            }

            async function updatePicture() {
                const file = document.getElementById("profilePicture").files[0];

                if (!file) {
                    return;
                }

                const formData = new FormData();
                formData.append("file", file);

                const response = await fetch(
                    "/users/me/upload-profile-picture",
                    {
                        method: "POST",
                        headers: {
                            Authorization: `Bearer ${token}`,
                        },
                        body: formData,
                    },
                );

                if (handleUnauthorized(response)) {
                    throw new Error("unauthorized");
                }

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Erro ao enviar imagem");
                }
            }

            form.addEventListener("submit", async function (event) {
                event.preventDefault();
                message.textContent = "";
                saveButton.disabled = true;

                try {
                    await updateInformation();
                    await updatePicture();
                    window.location.href = "/me";
                } catch (error) {
                    if (error.message !== "unauthorized") {
                        message.textContent = error.message;
                        message.className = "mb-3 text-danger";
                    }
                } finally {
                    saveButton.disabled = false;
                }
            });

            document
                .getElementById("logoutButton")
                .addEventListener("click", function () {
                    localStorage.removeItem("access_token");
                    window.location.href = "/";
                });

            loadUser();
        </script>
    </body>
</html>
