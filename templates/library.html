<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Biblioteca - Question Place</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', path='css/library.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container-fluid px-lg-5">
  <a class="navbar-brand fw-bold" href="/library"><i class="bi bi-book-half me-2"></i>Question Place</a>
  <div><a class="btn btn-sm btn-outline-light me-2" href="/me">Meu perfil</a><button id="logout" class="btn btn-sm btn-light">Sair</button></div>
</div></nav>
<main class="container-fluid px-lg-5 py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><h1 class="h3 mb-1">Meus conteúdos</h1><p class="text-secondary mb-0">Organize seus materiais de aprendizagem em um só lugar.</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadModal"><i class="bi bi-cloud-arrow-up me-2"></i>Novo conteúdo</button></div>
  <section class="filters p-3 mb-4"><div class="row g-2"><div class="col-md-8"><input id="search" class="form-control" placeholder="Pesquisar por nome, descrição ou tag"></div><div class="col-md-4"><select id="type" class="form-select"><option value="">Todos os tipos</option><option value="image">Imagens</option><option value="audio">Áudios</option><option value="video">Vídeos</option></select></div></div></section>
  <div id="message"></div><div id="grid" class="row g-4"></div>
</main>

<div class="modal fade" id="uploadModal" tabindex="-1"><div class="modal-dialog"><form id="uploadForm" class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5">Adicionar mídia</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
  <label class="form-label">Arquivo do conteúdo</label><input name="file" type="file" class="form-control mb-3" accept="image/jpeg,image/png,image/gif,image/svg+xml,image/webp,audio/mpeg,audio/wav,audio/ogg,audio/flac,video/mp4,video/x-msvideo,video/quicktime,video/webm" required>
  <label class="form-label">Descrição</label><textarea name="description" class="form-control mb-3" rows="2"></textarea>
  <label class="form-label">Tags <span class="text-secondary">(separadas por vírgula)</span></label><input name="tags" class="form-control mb-3">
  <label class="form-label">Gênero</label><input name="genre" class="form-control">
  <div id="uploadStatus" class="small mt-3"></div>
</div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-primary">Enviar e processar</button></div></form></div></div>

<div class="modal fade" id="detailModal" tabindex="-1"><div class="modal-dialog modal-lg"><div id="detail" class="modal-content"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', path='js/library.js') }}"></script>
</body></html>
