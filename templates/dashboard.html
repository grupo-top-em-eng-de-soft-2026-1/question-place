<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dashboard — QuestõesPro</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>

    <body class="bg-light">
        <nav class="navbar navbar-dark bg-primary">
            <div class="container">
                <span class="navbar-brand">QuestõesPro</span>

                <button id="logoutButton" class="btn btn-light btn-sm">
                    Sair
                </button>
            </div>
        </nav>

        <main class="container py-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h4">Dashboard</h1>

                    <p class="mb-1">
                        <strong>Nome:</strong>
                        <span id="fullName"></span>
                    </p>

                    <p class="mb-1">
                        <strong>Username:</strong>
                        <span id="username"></span>
                    </p>

                    <p class="mb-1">
                        <strong>Email:</strong>
                        <span id="email"></span>
                    </p>

                    <p class="mb-3">
                        <strong>Descrição:</strong>
                        <span id="description"></span>
                    </p>

                    <hr />

                    <h2 class="h5">Imagem de perfil</h2>

                    <form id="profilePictureForm">
                        <input
                            type="file"
                            class="form-control mb-3"
                            id="profilePicture"
                            accept="image/*"
                            required
                        />

                        <button class="btn btn-primary" type="submit">
                            Enviar imagem
                        </button>
                    </form>

                    <p id="message" class="mt-3"></p>
                </div>
            </div>
        </main>

        <script>
            const token = localStorage.getItem("access_token");

            if (!token) {
                window.location.href = "/";
            }

            async function loadUser() {
                const response = await fetch("/users/me", {
                    headers: {
                        Authorization: `Bearer ${token}`,
                    },
                });

                if (!response.ok) {
                    localStorage.removeItem("access_token");
                    window.location.href = "/";
                    return;
                }

                const user = await response.json();

                document.getElementById("fullName").textContent =
                    user.full_name;
                document.getElementById("username").textContent = user.username;
                document.getElementById("email").textContent = user.email;
                document.getElementById("description").textContent =
                    user.description || "Sem descrição";
            }

            document
                .getElementById("logoutButton")
                .addEventListener("click", function () {
                    localStorage.removeItem("access_token");
                    window.location.href = "/";
                });

            document
                .getElementById("profilePictureForm")
                .addEventListener("submit", async function (event) {
                    event.preventDefault();

                    const fileInput = document.getElementById("profilePicture");
                    const message = document.getElementById("message");

                    const formData = new FormData();
                    formData.append("file", fileInput.files[0]);

                    const response = await fetch("/users/me/profile-picture", {
                        method: "POST",
                        headers: {
                            Authorization: `Bearer ${token}`,
                        },
                        body: formData,
                    });

                    if (!response.ok) {
                        message.textContent = "Erro ao enviar imagem";
                        message.className = "mt-3 text-danger";
                        return;
                    }

                    message.textContent = "Imagem enviada com sucesso";
                    message.className = "mt-3 text-success";

                    loadUser();
                });

            loadUser();
        </script>
    </body>
</html>
