<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cadastro - QuestionPlace</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet"
        />

        <link
            href="{{ url_for('static', path='css/login.css') }}"
            rel="stylesheet"
        />
    </head>

    <body class="login-page register-page">
        <header class="login-header">
            <div class="login-logo" aria-hidden="true">
                <i class="bi bi-book"></i>
            </div>

            <h1>QuestionPlace</h1>
            <p>Comece sua preparação hoje mesmo</p>
        </header>

        <main class="login-card register-card" role="main">
            <h2>Criar conta gratuita</h2>

            <form id="registerForm" novalidate>
                <div class="mb-3">
                    <label for="fullName" class="form-label">
                        Nome completo
                    </label>

                    <div class="input-group-icon">
                        <i class="bi bi-person input-icon"></i>

                        <input
                            type="text"
                            class="form-control no-toggle"
                            id="fullName"
                            placeholder="Seu nome completo"
                            autocomplete="name"
                            required
                        />
                    </div>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">
                        Nome de usuário
                    </label>

                    <div class="input-group-icon">
                        <i class="bi bi-at input-icon"></i>

                        <input
                            type="text"
                            class="form-control no-toggle"
                            id="username"
                            placeholder="seu_usuario"
                            autocomplete="username"
                            required
                        />
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>

                    <div class="input-group-icon">
                        <i class="bi bi-envelope input-icon"></i>

                        <input
                            type="email"
                            class="form-control no-toggle"
                            id="email"
                            placeholder="seu@email.com"
                            autocomplete="email"
                            required
                        />
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>

                    <div class="input-group-icon">
                        <i class="bi bi-lock input-icon"></i>

                        <input
                            type="password"
                            class="form-control no-toggle"
                            id="password"
                            placeholder="••••••••"
                            autocomplete="new-password"
                            required
                        />
                    </div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">
                        Descrição
                        <span class="label-optional">(opcional)</span>
                    </label>

                    <textarea
                        class="form-control"
                        id="description"
                        rows="3"
                        placeholder="Fale um pouco sobre você"
                    ></textarea>
                </div>

                <p id="errorMessage" class="text-danger mt-3 mb-0"></p>
                <p id="successMessage" class="text-success mt-3 mb-0"></p>

                <button type="submit" class="btn btn-primary btn-login mt-3">
                    Criar conta
                </button>
            </form>

            <div class="login-divider">
                <span>ou</span>
            </div>

            <p class="login-signup">
                Já tem uma conta?
                <a href="/login">Entrar</a>
            </p>
        </main>

        <footer class="login-footer">
            © 2026 QuestionPlace. Todos os direitos reservados.
        </footer>

        <script>
            const form = document.getElementById("registerForm");
            const errorMessage = document.getElementById("errorMessage");
            const successMessage = document.getElementById("successMessage");

            form.addEventListener("submit", async function (event) {
                event.preventDefault();

                errorMessage.textContent = "";
                successMessage.textContent = "";

                const payload = {
                    full_name: document.getElementById("fullName").value,
                    username: document.getElementById("username").value,
                    email: document.getElementById("email").value,
                    password: document.getElementById("password").value,
                    description:
                        document.getElementById("description").value || null,
                };

                try {
                    const response = await fetch("/auth/register", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify(payload),
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        errorMessage.textContent =
                            data.detail || "Erro ao criar conta";
                        return;
                    }

                    successMessage.textContent =
                        "Conta criada com sucesso! Redirecionando...";

                    setTimeout(() => {
                        window.location.href = "/login";
                    }, 1200);
                } catch (error) {
                    errorMessage.textContent =
                        "Erro ao conectar com o servidor";
                }
            });
        </script>
    </body>
</html>
