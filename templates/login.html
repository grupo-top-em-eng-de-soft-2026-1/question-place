<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Entrar — QuestõesPro</title>

        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet"
        />
        <link
            href="{{ url_for('static', path='css/login.css') }}"
            rel="stylesheet"
        />
    </head>

    <body class="login-page">
        <header class="login-header">
            <div class="login-logo">
                <i class="bi bi-book"></i>
            </div>
            <h1>QuestõesPro</h1>
            <p>Prepare-se para seus concursos</p>
        </header>

        <main class="login-card">
            <h2>Entrar na plataforma</h2>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group-icon">
                        <i class="bi bi-person input-icon"></i>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            placeholder="seu username"
                            required
                        />
                    </div>
                </div>

                <div class="mb-1">
                    <label for="password" class="form-label">Senha</label>
                    <div class="input-group-icon">
                        <i class="bi bi-lock input-icon"></i>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required
                        />
                    </div>
                </div>

                <p id="errorMessage" class="text-danger mt-3 mb-0"></p>

                <button type="submit" class="btn btn-primary btn-login mt-3">
                    Entrar
                </button>
            </form>

            <div class="login-divider">
                <span>ou</span>
            </div>

            <p class="login-signup">
                Não tem uma conta?
                <a href="/register">Cadastre-se gratuitamente</a>
            </p>
        </main>

        <footer class="login-footer">
            © 2026 QuestõesPro. Todos os direitos reservados.
        </footer>

        <script>
            const form = document.getElementById("loginForm");
            const errorMessage = document.getElementById("errorMessage");

            form.addEventListener("submit", async function (event) {
                event.preventDefault();

                errorMessage.textContent = "";

                const payload = {
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value,
                };

                const response = await fetch("/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(payload),
                });

                const data = await response.json();

                if (!response.ok) {
                    errorMessage.textContent =
                        data.detail || "Erro ao fazer login";
                    return;
                }

                localStorage.setItem("access_token", data.access_token);

                window.location.href = "/dashboard";
            });
        </script>
    </body>
</html>
