<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — QuestõesPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', path='css/login.css') }}" rel="stylesheet" />
</head>
<body class="login-page">
  <header class="login-header">
    <div class="login-logo" aria-hidden="true">
      <i class="bi bi-book"></i>
    </div>
    <h1>QuestõesPro</h1>
    <p>Prepare-se para seus concursos</p>
  </header>

  <main class="login-card" role="main">
    <h2>Entrar na plataforma</h2>

    <form action="#" method="post" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <div class="input-group-icon">
          <i class="bi bi-envelope input-icon" aria-hidden="true"></i>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="seu@email.com"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <div class="mb-1">
        <label for="password" class="form-label">Senha</label>
        <div class="input-group-icon">
          <i class="bi bi-lock input-icon" aria-hidden="true"></i>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
            aria-label="Mostrar senha"
            title="Mostrar senha"
          >
            <i class="bi bi-eye" id="togglePasswordIcon" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="login-options">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember" name="remember" />
          <label class="form-check-label" for="remember">Lembrar-me</label>
        </div>
        <a href="#">Esqueci minha senha</a>
      </div>

      <button type="submit" class="btn btn-primary btn-login">Entrar</button>
    </form>

    <div class="login-divider" aria-hidden="true">
      <span>ou</span>
    </div>

    <p class="login-signup">
      Não tem uma conta?
      <a href="/cadastro">Cadastre-se gratuitamente</a>
    </p>
  </main>

  <footer class="login-footer">
    © 2026 QuestõesPro. Todos os direitos reservados.
  </footer>

  <button type="button" class="help-fab" aria-label="Ajuda" title="Ajuda">?</button>

  <script>
    (function () {
      var input = document.getElementById("password");
      var btn = document.getElementById("togglePassword");
      var icon = document.getElementById("togglePasswordIcon");
      if (!input || !btn || !icon) return;

      btn.addEventListener("click", function () {
        var show = input.type === "password";
        input.type = show ? "text" : "password";
        icon.classList.toggle("bi-eye", !show);
        icon.classList.toggle("bi-eye-slash", show);
        btn.setAttribute("aria-label", show ? "Ocultar senha" : "Mostrar senha");
        btn.setAttribute("title", show ? "Ocultar senha" : "Mostrar senha");
      });
    })();
  </script>
</body>
</html>
