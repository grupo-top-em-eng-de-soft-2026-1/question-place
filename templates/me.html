<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dashboard - QuestionPlace</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>

    <body class="bg-light">
        <nav class="navbar navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand text-decoration-none" href="/library">Question Place</a>

                <button id="logoutButton" class="btn btn-light btn-sm">
                    Sair
                </button>
            </div>
        </nav>

        <main class="container py-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <img
                            id="profileImage"
                            src="https://placehold.co/96x96?text=?"
                            alt="Foto de perfil"
                            class="rounded-circle border"
                            style="width: 96px; height: 96px; object-fit: cover"
                        />

                        <div>
                            <h1 class="h4 mb-1" id="headerFullName">
                                Carregando...
                            </h1>

                            <p class="text-muted mb-0" id="headerUsername">
                                @usuario
                            </p>
                        </div>
                    </div>
                    <div
                        class="d-flex align-items-center justify-content-between gap-3 mb-3"
                    >
                        <h1 class="h4 mb-0">Dashboard</h1>

                        <div class="d-flex gap-2"><a href="/library" class="btn btn-outline-primary">Meus conteúdos</a><a href="/me/edit" class="btn btn-primary">
                            Editar perfil
                        </a></div>
                    </div>

                    <p class="mb-2">
                        <strong>Nome:</strong>
                        <span id="fullName"></span>
                    </p>

                    <p class="mb-2">
                        <strong>Username:</strong>
                        <span id="username"></span>
                    </p>

                    <p class="mb-2">
                        <strong>Email:</strong>
                        <span id="email"></span>
                    </p>

                    <p class="mb-0">
                        <strong>Descrição:</strong>
                        <span id="description"></span>
                    </p>
                </div>
            </div>
        </main>

        <script>
            const token = localStorage.getItem("access_token");

            if (!token) {
                window.location.href = "/";
            }

            async function loadUser() {
                const response = await fetch("/users/me", {
                    headers: {
                        Authorization: `Bearer ${token}`,
                    },
                });

                if (!response.ok) {
                    localStorage.removeItem("access_token");
                    window.location.href = "/";
                    return;
                }

                const user = await response.json();

                document.getElementById("fullName").textContent =
                    user.full_name;

                document.getElementById("username").textContent = user.username;

                document.getElementById("headerFullName").textContent =
                    user.full_name;

                document.getElementById("headerUsername").textContent =
                    "@" + user.username;
                document.getElementById("email").textContent = user.email;
                document.getElementById("description").textContent =
                    user.description || "Sem descrição";

                if (user.profile_picture_url) {
                    document.getElementById("profileImage").src =
                        user.profile_picture_url;
                }
            }

            document
                .getElementById("logoutButton")
                .addEventListener("click", function () {
                    localStorage.removeItem("access_token");
                    window.location.href = "/";
                });

            loadUser();
        </script>
    </body>
</html>
